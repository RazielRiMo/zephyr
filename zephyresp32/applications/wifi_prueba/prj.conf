# -----------------------------------------------------------------------------
# Zephyr / consola
# -----------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# -----------------------------------------------------------------------------
# JSON
# -----------------------------------------------------------------------------
CONFIG_JSON_LIBRARY=y

# -----------------------------------------------------------------------------
# Networking / TCP / IPv4
# -----------------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n
CONFIG_NET_DHCPV4=y

# Buffers / contextos: Wi-Fi + TCP requieren más margen que un ejemplo mínimo.
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6

# -----------------------------------------------------------------------------
# Wi-Fi ESP32
# NOTA: estas opciones corresponden al flujo usado en Zephyr 4.4.x.
# En Zephyr 4.5+ la opción específica de DHCP de Espressif fue reemplazada
# por CONFIG_WIFI_STA_AUTO_DHCPV4.
# -----------------------------------------------------------------------------
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y
CONFIG_WIFI_LOG_LEVEL_ERR=y

# DHCP / eventos de red
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Utilidades
# -----------------------------------------------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_REBOOT=y
