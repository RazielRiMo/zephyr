# prj.conf
# Configuración de Zephyr para el puente TCP/JSON entre la ESP32 y la PC.
#
# NOTA: el SSID, la contraseña, el puerto TCP y el período de telemetría
# YA NO se configuran aquí -- viven como #define en
# firmware_zephyr/src/network_config.h, tal como pidió el enunciado
# ("fácilmente manipulables desde un archivo de cabecera o el inicio del
# main"). Este archivo solo activa subsistemas del kernel/red, que sí
# pertenecen al sistema Kconfig de Zephyr.
#
# NOTA IMPORTANTE: los nombres exactos de algunas opciones del driver Wi-Fi
# de la ESP32 (p. ej. CONFIG_WIFI_ESP32) pueden variar levemente según la
# versión de Zephyr y del módulo HAL de Espressif que tengas instalado.
# Si `west build` reporta que una opción "no existe", ejecuta
# `west build -t menuconfig`, busca "ESP32" / "WIFI" y ajusta el nombre.

# --- Kernel / logging ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# --- GPIO (LED de acción local) ---
CONFIG_GPIO=y

# --- Librería JSON integrada de Zephyr (<data/json.h>) ---
# Requisito del proyecto: codificar/decodificar JSON EXCLUSIVAMENTE con
# esta librería (nada de cJSON, nada de snprintf armando texto JSON a mano).
CONFIG_JSON_LIBRARY=y

# --- Red: base TCP/IP ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POLL=y
CONFIG_NET_DHCPV4=y

# Buffers de red: las tramas de este proyecto son pequeñas (< 256 B), pero
# se deja margen para varios paquetes en vuelo.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6

# --- Wi-Fi ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Heap adicional que usan el driver Wi-Fi y la pila de red
CONFIG_HEAP_MEM_POOL_SIZE=65536
