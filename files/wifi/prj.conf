# prj.conf
# Configuración de Zephyr para el puente TCP/JSON entre la ESP32 y la PC.
#
# NOTA IMPORTANTE: los nombres exactos de algunas opciones del driver Wi-Fi
# de la ESP32 (p. ej. CONFIG_WIFI_ESP32) pueden variar levemente según la
# versión de Zephyr y del módulo HAL de Espressif que tengas instalado.
# Si `west build` reporta que una opción "no existe", ejecuta
# `west build -t menuconfig`, busca "ESP32" / "WIFI" y ajusta el nombre.

# --- Kernel / logging ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

# --- GPIO (LED de acción local) ---
CONFIG_GPIO=y

# --- Red: base TCP/IP ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_DHCPV4=y

# Buffers de red: las tramas de este proyecto son pequeñas (< 256 B), pero
# se deja margen para varios paquetes en vuelo.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_MAX_CONTEXTS=6

# --- Wi-Fi ---
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Heap adicional que usan el driver Wi-Fi y la pila de red
CONFIG_HEAP_MEM_POOL_SIZE=65536

# --- Valores de la aplicación (ver Kconfig del proyecto) ---
# SSID y contraseña de la red: la forma recomendada de modificarlos es
# EDITAR ESTAS DOS LÍNEAS antes de compilar (no hace falta tocar main.c).
CONFIG_APP_WIFI_SSID="MI_RED_WIFI"
CONFIG_APP_WIFI_PSK="MI_CONTRASENA"
CONFIG_APP_TCP_PORT=5000
CONFIG_APP_TELEMETRY_PERIOD_MS=2000
